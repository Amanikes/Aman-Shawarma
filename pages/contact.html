<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Aman's Shawarma</title>
</head>
<body>
    <header>
        <p><strong>Aman's Shawarma</strong></p>
        <nav aria-label="Main navigation">
            <a href="../index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Contact and Order</h1>

        <section>
            <h2>Customer Information</h2>
            <form action="#" method="post">
                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone">
                </p>
                <p>
                    <label for="meal">Choose a meal:</label>
                    <select id="meal" name="meal" required>
                        <option value="">Please select</option>
                        <option value="chicken">Chicken Shawarma</option>
                        <option value="beef">Beef Shawarma</option>
                        <option value="falafel">Falafel Wrap</option>
                    </select>
                </p>
                <p>
                    <label for="message">Special instructions:</label>
                    <textarea id="message" name="message" rows="4" cols="40"></textarea>
                </p>
                <p>
                    <button type="submit">Submit Order</button>
                </p>
            </form>
        </section>

        <section>
            <h2>Visit or Email Us</h2>
            <p>Open daily from 11:00 AM to 10:00 PM.</p>
            <p><a href="mailto:amanualebelete6@gmail.com">amanualebelete6@gmail.com</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Aman's Shawarma</p>
        <p><a href="mailto:amanualebelete6@gmail.com">Email Aman's Shawarma</a></p>
    </footer>
</body>
</html>
